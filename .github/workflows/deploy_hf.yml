name: CD - Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps (dev)
        run: uv sync --frozen --dev

      - name: Ruff lint (static checks)
        run: uv run ruff check . --output-format=github

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

      - name: Bandit (security scan)
        run: uv run bandit -r app monitoring -x tests -q

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install --local

      - name: Push to Hugging Face Space (main) - filtered snapshot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          set -euo pipefail

          # Sanity checks (fail fast with a clear message)
          if [[ -z "${HF_TOKEN}" || -z "${HF_USERNAME}" || -z "${HF_SPACE_NAME}" ]]; then
            echo "Missing one of HF_TOKEN / HF_USERNAME / HF_SPACE_NAME secrets."
            exit 1
          fi

          # Ensure remote exists (idempotent)
          if git remote get-url hf >/dev/null 2>&1; then
            git remote remove hf
          fi
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          # Create a deploy branch from the current commit (does NOT affect GitHub)
          git checkout -B hf-deploy

          # Remove binary files that HF rejects in git pushes
          # (Keep this list minimal; you can add more patterns if needed)
          shopt -s globstar nullglob

          # Remove tracked .odp files (the one that broke your push)
          git rm -f --ignore-unmatch **/*.odp *.odp || true

          # Optionally remove other "deliverable" binaries if you ever add them:
          # git rm -f --ignore-unmatch **/*.pptx **/*.docx **/*.pdf || true

          # Commit only if something changed
          if ! git diff --cached --quiet; then
            git commit -m "deploy: filtered snapshot for Hugging Face"
          else
            echo "No files to filter from the deploy snapshot."
          fi

          # Push the snapshot to HF main (force to overwrite previous snapshot)
          git push -f hf hf-deploy:main
