name: CD - Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps (dev)
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Bandit
        run: uv run bandit -r app monitoring -x tests -q

      - name: Deploy to Hugging Face Space (snapshot + Xet)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          set -euo pipefail

          # --- prerequisites: git-lfs + git-xet (Xet) ---
          sudo apt-get update
          sudo apt-get install -y git-lfs unzip curl
          git lfs install

          # Install git-xet (Xet) - required for large binaries on HF Hub
          # Doc: Using Xet Storage -> Git install script
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh \
            | sh
          git xet install
          git xet --version

          # --- verify secrets ---
          if [[ -z "${HF_TOKEN}" || -z "${HF_USERNAME}" || -z "${HF_SPACE_NAME}" ]]; then
            echo "Missing one of HF_TOKEN / HF_USERNAME / HF_SPACE_NAME secrets."
            exit 1
          fi

          # --- make sure LFS files are actually present in the runner workspace ---
          git lfs pull

          echo "== Preflight artifacts =="
          ls -la app/artifacts || true
          test -f app/artifacts/model.joblib
          test -f app/artifacts/model_meta.json
          ls -lh app/artifacts/model.joblib

          # --- HF remote (idempotent) ---
          if git remote get-url hf >/dev/null 2>&1; then
            git remote remove hf
          fi
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          # --- snapshot deploy (no history) to avoid old binaries in commit history ---
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan hf-deploy

          # remove offending deliverable binaries for HF (ODP)
          find . -type f -name "*.odp" -print -delete || true

          # stage everything for the snapshot
          git reset
          git add -A

          # (safety) if you ever ignore *.joblib in .gitignore, force-add:
          git add -f app/artifacts/model.joblib app/artifacts/model_meta.json || true

          git commit -m "deploy: snapshot to HF (xet, no odp)"
          git push -f hf hf-deploy:main
