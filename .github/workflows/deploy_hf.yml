name: CD - Deploy to Hugging Face Space

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-hf
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps (dev)
        run: uv sync --frozen --dev

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Bandit
        run: uv run bandit -r app monitoring -x tests -q

      - name: Deploy to Hugging Face (snapshot branch, filtered)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          set -euo pipefail

          if [[ -z "${HF_TOKEN}" || -z "${HF_USERNAME}" || -z "${HF_SPACE_NAME}" ]]; then
            echo "Missing one of HF_TOKEN / HF_USERNAME / HF_SPACE_NAME secrets."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure Git LFS is active (important if model.joblib is tracked via LFS)
          git lfs install --local

          # Add / refresh HF remote
          if git remote get-url hf >/dev/null 2>&1; then
            git remote remove hf
          fi
          git remote add hf "https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          # Create an orphan branch so we DO NOT push full history (avoids banned binaries in old commits)
          git checkout --orphan hf-deploy

          # Remove binaries that HF rejects from the working tree before committing the snapshot
          # Add more patterns if needed, but keep minimal
          find . -type f \( -name "*.odp" \) -print -delete || true

          # (Optional safety) also exclude typical “deliverables”
          # find . -type f \( -name "*.pptx" -o -name "*.docx" \) -print -delete || true

          # Clean index and commit snapshot
          git reset
          git add -A
          git commit -m "deploy: snapshot to Hugging Face (filtered)"

          # Force push snapshot to HF main
          git push -f hf hf-deploy:main
