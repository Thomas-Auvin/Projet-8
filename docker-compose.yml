services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: projet-8-api
    ports:
      - "8000:7860"
    environment:
      P8_DB_PATH: /home/user/app/data/prod/predictions.sqlite
      P8_ARTIFACTS_DIR: /home/user/app/app/artifacts
      P8_STRICT_INPUT: "1"
    volumes:
      - ./data:/home/user/app/data
      - ./app/artifacts:/home/user/app/app/artifacts:ro

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: projet-8-dashboard
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      P8_DB_PATH: /home/user/app/data/prod/predictions.sqlite
    volumes:
      # le dashboard lit les JSON (drift/bench). On laisse RW si tu veux générer depuis le conteneur.
      - ./outputs:/home/user/app/outputs
      # DB en lecture seule côté dashboard (sécurité)
      - ./data:/home/user/app/data:ro
